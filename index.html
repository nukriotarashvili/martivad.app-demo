<!-- Self-hosted FiraGO — no external font host, so the page keeps working
     offline and nothing about the visitor leaves the device. -->
<link rel="preload" href="assets/fonts/firago-regular-georgian.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/styles.css">

<!-- Theme before first paint. Unset data-theme = follow prefers-color-scheme,
     which is what a first-time visitor gets. -->
<script>
  (function () {
    try {
      var m = localStorage.getItem("martivad.theme");
      if (m === "light" || m === "dark") document.documentElement.setAttribute("data-theme", m);
      document.documentElement.dataset.themeGuard = "1";
    } catch (e) { /* storage disabled — the media query still governs */ }
  })();
</script>
